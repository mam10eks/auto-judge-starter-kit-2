[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-judge-starterkit"
version = "1.0.0"
description = "Example AutoJudge implementations for building custom judges"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TREC AutoJudge Team"}
]
keywords = ["trec", "autojudge", "rag", "evaluation", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "autojudge-base>=1.0.0",
    "tira>=0.0.100",
    # slm/torch deps, a cuda environment is also required
    # note: requires uv to pick up special index for cuda enabled builds
    "sentence-transformers",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
minima-llm = [
    "minima-llm>=0.2.5",
]
evaluate = [
    "autojudge-evaluate>=1.0.0",
]
all = [
    "auto-judge-starterkit[minima-llm,evaluate,test]",
    "tqdm>=4.0",
]

[project.urls]
Homepage = "https://github.com/trec-auto-judge/auto-judge-starter-kit"
Repository = "https://github.com/trec-auto-judge/auto-judge-starter-kit"

[tool.setuptools.packages.find]
where = ["."]
include = ["judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
